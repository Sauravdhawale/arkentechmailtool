services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arkenmailtool
      POSTGRES_USER: nobounce
      POSTGRES_PASSWORD: NoBounceArken2026
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://nobounce:NoBounceArken2026@postgres:5432/arkenmailtool?schema=public
      REDIS_URL: redis://redis:6379
      REACHER_API_URL: https://verify.arkentechsolutions.com/v1/check_email
      REACHER_API_TOKEN: ""
      REACHER_REQUEST_TIMEOUT_MS: 35000
      CORS_ORIGIN: https://nobounce.arkentechsolutions.com,http://localhost:5173
      API_ACCESS_TOKEN: ""
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW: 1 minute
      UPLOAD_MAX_BYTES: 10485760
      UPLOAD_MAX_ROWS: 100000
      XLSX_MAX_XML_BYTES: 268435456
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://nobounce:NoBounceArken2026@postgres:5432/arkenmailtool?schema=public
      REDIS_URL: redis://redis:6379
      REACHER_API_URL: https://verify.arkentechsolutions.com/v1/check_email
      REACHER_BULK_API_URL: https://verify.arkentechsolutions.com/v1/bulk
      REACHER_API_TOKEN: ""
      WORKER_CONCURRENCY: 1
      WORKER_RATE_LIMIT_PER_MINUTE: 30
      BULK_POLL_INTERVAL_MS: 5000
      BULK_RESULTS_PAGE_SIZE: 1000
      BULK_MAX_WAIT_MINUTES: 240
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: https://nobounce-api.arkentechsolutions.com
        VITE_API_ACCESS_TOKEN: ""
    depends_on:
      - backend
    ports:
      - "127.0.0.1:9100:80"

volumes:
  postgres_data:
